<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Doña Leo</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img src="img/logo.png" alt="Logo Restaurante" class="logo-sm">
      </div>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html#menu">Menú</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="form-page">
    <h2>Contáctanos</h2>
    <form id="contactForm">
      <div class="field">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="phone">Teléfono (opcional):</label>
        <input type="tel" id="phone" name="phone">
      </div>

      <div class="field">
        <label for="message">Mensaje:</label>
        <textarea id="message" name="message" rows="4" required></textarea>
      </div>

      <div class="field checkbox">
        <input type="checkbox" id="policy" name="policy" required>
        <label for="policy">Acepto la política de privacidad</label>
      </div>

      <button type="submit" class="btn">Enviar</button>
      <div id="formMessage" role="status"></div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
